    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Little Wings</title>

        <!--Child-like font from google fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playwrite+AU+QLD:wght@100..400&display=swap" rel="stylesheet">

        <!--css styling :)-->
        <link rel="stylesheet" href="style.css">

        <script src="https://unpkg.com/tone"></script>
    </head>
    <body>
        
        <h1>Little Wings</h1>

        <div class="control-buttons">
            <button id="daynightbutton" aria-label="Toggle day or night">☾</button>
            <button id="startstopbutton" aria-label="start or pause">▶</button>
        </div>

        <div class="volume-controls">
            <button id="mutebutton" aria-label="Mute or unmute">🎶</button>
        </div> 
        
        <div id="clouds"></div>

        <img src="cloud.png" class="cloud size-lg" 
        style="top:15%; left:10%;" data-note="C4" alt="cloud">

        <img src="cloud.png" class="cloud size-lg"
         style="top:65%; left:15%;" data-note="D4" alt="cloud">

        <img src="cloud.png" class="cloud size-lg" 
        style="top:18%; left:68%;" data-note="E4" alt="cloud">

        <img src="cloud.png" class="cloud size-md" 
        style="top:68%; left:75%;" data-note="G4" alt="cloud">

        <img src="cloud.png" class="cloud size-lg" 
        style="top:38%; left:85%;" data-note="A4" alt="cloud">

        <img src="plane.png" id="plane" alt="plane">
</div>

<script src="main.js" defer></script>
        
    </body>
    </html>
