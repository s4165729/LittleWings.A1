    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--Child-like font from google fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playwrite+AU+QLD:wght@100..400&display=swap" rel="stylesheet">

        <!--css styling :)-->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        
        <h1>Little Wings</h1>

        <div class="control-buttons">
            <button id="daynightbutton" aria-label="Toggle day or night">☾</button>
            <button id="startstopbutton" aria-label="start or pause">▶</button>
        </div>

        <script>
            const button = document.getElementById("startstopbutton");
            const daynightbutton = document.getElementById("daynightbutton");

            button.addEventListener("click", function() {
                if (button.textContent === "▶") {
                    button.textContent="⏯"
                } else {
                    button.textContent = "▶︎";
                }
            });

            daynightbutton.addEventListener("click", function() {
                if (daynightbutton.textContent ==="☾") {
                    daynightbutton.textContent ="☼";
                }else {
                    daynightbutton.textContent ="☾";
                }
            });
        </script>

        <div id="cloud-field"></div>
        <img src="cloud.png" class="cloud size-sm" data-note="C4" alt="cloud">
        <img src="cloud.png" class="cloud size-lg" data-note="D4" alt="cloud">
        <img src="cloud.png" class="cloud size-md" data-note="E4" alt="cloud">
        <img src="cloud.png" class="cloud size-lg" data-note="G4" alt="cloud">
        <img src="cloud.png" class="cloud size-sm" data-note="A4" alt="cloud">
        

    </body>
    </html>
