    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Little Wings</title>

        <!--Child-like font from google fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Playwrite+AU+QLD:wght@100..400&display=swap" rel="stylesheet">

        <!--css styling :)-->
        <link rel="stylesheet" href="style.css">

        <script src="https://unpkg.com/tone"></script>
    </head>
    <body>
        
        <h1>Little Wings</h1>

        <a href="https://github.com/s4165729"
        target="_blank"
        rel="noopener"
        class="myprofile-box">
        My Profile
    </a>
        

        <div class="volume-controls">
            <button class="vol-btn" id="mutebutton" aria-label="Mute or unmute">🎶</button>
            <button class="vol-btn" id="volumedownbutton" aria-label="Volume down">-</button>
            <button class="vol-btn" id="volumeupbutton" aria-label="Volume up">+</button>
        </div> 
        
        <div id="clouds">

        <img src="cloud.png" class="cloud size-md" 
        style="top:10%; left:5%;" 
        data-note="C4" alt="C4 piano note">

        <img src="cloud.png" class="cloud size-lg" 
        style="top:35%; left:20%;" 
        data-note="D4" alt="D4 piano note">

        <img src="cloud.png" class="cloud size-lg" 
        style="top:13%; left:28%;" 
        data-note="E4" alt="E4 piano note">

        <img src="cloud.png" class="cloud size-md" 
        style="top:45%; left:55%;" 
        data-note="F4" alt="F4 piano note">

        <img src="cloud.png" class="cloud size-lg" 
        style="top:20%; left:70%;" 
        data-note="G4" alt="G4 piano note">

        <img src="cloud.png" class="cloud size-lg" 
        style="top:60%; left:75%;" 
        data-note="A4" alt="A4 piano note">

        <img src="cloud.png" class="cloud size-md" 
        style="top:55%; left:35%;" 
        data-note="B4" alt="B4 piano note">

        <img src="cloud.png" class="cloud size-lg" 
        style="top:65%; left:10%;" 
        data-note="C5" alt="C5 piano note">

        <img src="plane.png" id="plane" alt="plane">
</div>

<!--start/stop button, day/night button and link to portfolio and information on how to play-->
<div class="control-buttons">
    <a class="ctrl-btn" id="portfoliobutton" href="https://s4165729.github.io/specialisationWorkIndex/" target="_blank" rel="noopener" aria-label="View my work index">📖</a>
    <button class="ctrl-btn" id="infobutton" aria-label="How to play">⚙︎</button>
    <button class="ctrl-btn" id="startstopbutton" aria-label="start or pause">▶︎</button>
    <button class="ctrl-btn" id="daynightbutton" aria-label="toggle day or night">☾</button>
</div>

<!--instruction popup shown automatically when page loads-->
<div id="modal-overlay">
    <div class="modal-card">
        <h2>HOW TO PLAY</h2>
        <p>Tap a cloud to play a note. Tap again to stop</p>
        <p> ▶︎ (start)<p>
        <p> 🎶  - + (noise controls) </p> 
        <button id="modal-close">Got it!</button>
    </div>
</div>


<script src="main.js" defer></script>
        
    </body>
    </html>
